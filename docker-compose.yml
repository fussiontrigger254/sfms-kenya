version: "3.9"

services:
  db:
    image: postgres:15
    container_name: sfms_postgres
    restart: always
    environment:
      POSTGRES_DB: sfms_db
      POSTGRES_USER: sfms_user
      POSTGRES_PASSWORD: sfms_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  web:
    build: ./backend
    container_name: sfms_django
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DB_NAME: sfms_db
      DB_USER: sfms_user
      DB_PASSWORD: sfms_password
      DB_HOST: db
      DB_PORT: 5432

volumes:
  postgres_data: